services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taktikon
      POSTGRES_PASSWORD: taktikon
      POSTGRES_DB: taktikon
    ports:
      - '5432:5432'
    volumes:
      - taktikon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taktikon']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taktikon_pg:
