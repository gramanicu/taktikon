services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taktikon
      POSTGRES_PASSWORD: taktikon
      POSTGRES_DB: taktikon
    ports:
      - '5432:5432'
    volumes:
      - taktikon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taktikon']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Observability stack (Grafana LGTM). Started on demand:
  #   docker compose --profile observability up -d
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    profiles: [observability]
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro

  loki:
    image: grafana/loki:3.3.0
    profiles: [observability]
    command: ['-config.file=/etc/loki/local-config.yaml']

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '3001:3000'
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  taktikon_pg:
