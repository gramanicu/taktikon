name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: dropdown
    id: pillar
    attributes:
      label: Which pillar?
      options:
        - Army building
        - Collection tracking
        - Rules reference
        - Cross-cutting / other
    validations:
      required: false
